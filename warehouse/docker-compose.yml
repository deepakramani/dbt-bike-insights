services:
  dwh-crm-erp:
    container_name: dwh-crm-erp_container
    image: postgres:15-alpine
    hostname: ${POSTGRES_HOST}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5434:5432
    volumes:
      - "./postgres_init_db:/docker-entrypoint-initdb.d"
      - "./input_data:/home/input_data:rw"
      - "../psql_vol:/var/lib/postgresql/data:rw"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 900s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - bike_insights_network

  api_service:
    build:
      context: ../api_data
      dockerfile: Dockerfile
    container_name: api_service_container
    volumes:
      - ../api_data/cust_info_with_attributes.json:/app/cust_info_with_attributes.json
      - ../api_data/sales_details_with_attributes.json:/app/sales_details_with_attributes.json
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
    depends_on:
      - dwh-crm-erp
    networks:
      - bike_insights_network

  grafana_service:
    image: grafana/grafana:10.0.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - "./grafana_data:/var/lib/grafana:rw"
    depends_on:
      - dwh-crm-erp
    networks:
      - bike_insights_network

volumes:
  grafana_data:

networks:
  bike_insights_network:
    name: bike_insights_network
    driver: bridge
